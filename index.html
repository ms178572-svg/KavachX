
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KavachX | Secure Access</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-background">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
    </div>

    <main class="auth-container">

        <!-- BRAND -->
        <div class="auth-brand">
            <div class="auth-shield">🛡️</div>

            <h1>Kavach<span>X</span></h1>

            <p class="brand-tagline">
                Intelligent Cybersecurity Protection
            </p>
        </div>

        <!-- AUTH CARD -->
        <section class="auth-card">

            <div class="auth-heading">
                <h2>Welcome Back</h2>

                <p>
                    Secure your digital world with KavachX
                </p>
            </div>

            <!-- TABS -->
            <div class="auth-tabs">

                <button
                    type="button"
                    id="loginTab"
                    class="auth-tab active"
                    onclick="showLogin()">
                    Login
                </button>

                <button
                    type="button"
                    id="registerTab"
                    class="auth-tab"
                    onclick="showRegister()">
                    Register
                </button>

            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">Email Address</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required>
                </div>

                <button type="submit" class="auth-submit">
                    Login Securely
                    <span>→</span>
                </button>

            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" style="display:none;">

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required>
                </div>

                <button type="submit" class="auth-submit">
                    Create Account
                    <span>→</span>
                </button>

            </form>

            <!-- MESSAGE -->
            <div id="message" class="auth-message"></div>

            <!-- SECURITY FOOTER -->
            <div class="auth-security">

                <span class="security-dot"></span>

                <p>
                    Protected by KavachX Security
                </p>

            </div>

        </section>

        <footer class="auth-footer">
            © 2026 KavachX • Digital Security Platform
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
